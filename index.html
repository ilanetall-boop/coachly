<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coachly — Coach personnel d'Ilane</title>
  <meta name="description" content="Coach IA personnel de nutrition, sport et transformation physique — suivi, graphiques et adaptation continue." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coachly" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app">
    <div class="logo">Coach<span class="dot">·</span>ly</div>
    <div class="sub">Coach perso d'Ilane · objectif : sec &amp; athlétique</div>
    <div class="spacer"></div>
    <div class="sub" id="dateToday"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>

  <footer>
    Coachly <span id="appVersion">v7</span> — outil de suivi, pas un avis médical.<br />
    Pour le LDL, la fonction rénale et le fer, suis ton médecin.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/program.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("dateToday").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    // Enregistrement du service worker (PWA + hors-ligne + rappels)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW:", e));
      });
    }
  </script>
</body>
</html>
